<div id="form">
  <div class="col-md-6">
    <div class="panel panel-default">
      <div class="panel-body">
        <div class="form-horizontal">
          <div class="form-group">
            <label for="no_rkm_medis" class="col-sm-3 control-label">Nomor RM</label>
            <div class="col-sm-4">
              <div class="input-group" style="width: 100%">
                <input type="text" id="no_rkm_medis" name="no_rkm_medis" class="form-control" value="{$pasien.no_rkm_medis}" {if: !empty($pasien.no_rkm_medis)}disabled{/if}>
                <span class="input-group-addon"><input type="checkbox" name="manual" id="norm_manual"></span>
              </div>
            </div>
            <label for="tgl_daftar" class="col-sm-2 control-label">Tgl. Daftar</label>
            <div class="col-sm-3">
              <input type="text" id="tgl_daftar" name="tgl_daftar" class="form-control tgl_daftar" value="{$pasien.tgl_daftar}">
            </div>
          </div>
          <div class="form-group">
            <label for="nm_pasien" class="col-sm-3 control-label">Nama</label>
            <div class="col-sm-9">
              <input type="text" name="nm_pasien" class="form-control nama" value="{$pasien.nm_pasien}">
            </div>
          </div>
          <div class="form-group">
            <label for="jk" class="col-sm-3 control-label">Sex</label>
            <div class="col-sm-4">
              <select class="form-control" name="jk" id="jk">
                <option value="L" {if: $pasien.jk == 'L'}selected{/if}>Laki-Laki</option>
                <option value="P" {if: $pasien.jk == 'P'}selected{/if}>Perempuan</option>
              </select>
            </div>
            <label for="tgl_lahir" class="col-sm-2 control-label">Tgl. Lahir</label>
            <div class="col-sm-3">
              <input type="text" id="tgl_lahir" name="tgl_lahir" class="form-control tgl_lahir" value="{$pasien.tgl_lahir}">
            </div>
          </div>
          <div class="{if: $admin_mode == 'simple'}hidden{/if}">
            <div class="form-group">
              <label for="" class="col-sm-3 control-label">Nama Ibu</label>
              <div class="col-sm-4">
                <input type="text" name="nm_ibu" class="form-control" value="{$pasien.nm_ibu}">
              </div>
              <label for="gol_darah" class="col-sm-2 control-label">Darah</label>
              <div class="col-sm-3">
                <select class="form-control" name="gol_darah" id="gol_darah">
                  <option value="O" {if: $pasien.gol_darah == 'O'}selected{/if}>O</option>
                  <option value="A" {if: $pasien.gol_darah == 'A'}selected{/if}>A</option>
                  <option value="B" {if: $pasien.gol_darah == 'B'}selected{/if}>B</option>
                  <option value="AB" {if: $pasien.gol_darah == 'AB'}selected{/if}>AB</option>
                  <option value="-" {if: $pasien.gol_darah == '-'}selected{/if}>-</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="stts_nikah" class="col-sm-3 control-label">Status Nikah</label>
              <div class="col-sm-4">
                <select name="stts_nikah" class="form-control">
                  {loop: $stts_nikah}
                    <option value="{$value}"{if: $value == $pasien.stts_nikah} selected{/if}>{$value}</option>
                  {/loop}
                </select>
              </div>
              <label for="no_peserta" class="col-sm-2 control-label">Agama</label>
              <div class="col-sm-3">
                <select name="agama" class="form-control">
                  {loop: $agama}
                    <option value="{$value}"{if: $value == $pasien.agama} selected{/if}>{$value}</option>
                  {/loop}
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="pekerjaan" class="col-sm-3 control-label">Pekerjaan</label>
              <div class="col-sm-4">
                <input type="text" name="pekerjaan" class="form-control" value="{$pasien.pekerjaan}">
              </div>
              <label for="pnd" class="col-sm-2 control-label">PND</label>
              <div class="col-sm-3">
                <select class="form-control" name="pnd" id="pnd">
                  {loop: $pnd}
                  <option value="{$value}" {if: $value == $pasien.pnd}selected{/if}>{$value}</option>
                  {/loop}
                </select>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="asuransi" class="col-sm-3 control-label">Penjamin</label>
            <div class="col-sm-4">
              <select class="form-control" name="kd_pj">
                {loop: $penjab}
                <option value="{$value.kd_pj}" {if: $pasien.kd_pj == $value.kd_pj}selected{/if}>{$value.png_jawab}</option>
                {/loop}
              </select>
            </div>
            <label for="no_peserta" class="col-sm-2 control-label">No. Kartu</label>
            <div class="col-sm-3">
              <input type="text" name="no_peserta" id="no_peserta" class="form-control noKartu" value="{$pasien.no_peserta}">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="panel panel-default">
      <div class="panel-body">
        <div class="form-horizontal">
          <div class="{if: $admin_mode == 'simple'}hidden{/if}">
            <div class="form-group">
              <label for="asuransi" class="col-sm-3 control-label">Keluarga</label>
              <div class="col-sm-4">
                <select class="form-control" name="keluarga">
                  {loop: $keluarga}
                  <option value="{$value}" {if: $value == $pasien.keluarga}selected{/if}>{$value}</option>
                  {/loop}
                </select>
              </div>
              <label for="namakeluarga" class="col-sm-1 control-label">Nama</label>
              <div class="col-sm-4">
                <input type="text" name="namakeluarga" class="form-control" value="{$pasien.namakeluarga}">
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="no_ktp" class="col-sm-3 control-label">Nomor KTP</label>
            <div class="col-sm-9">
              <input type="text" name="no_ktp" id="no_ktp" class="form-control no_ktp" value="{$pasien.no_ktp}">
            </div>
          </div>
          <div class="form-group">
            <label for="alamat" class="col-sm-3 control-label">Alamat</label>
            <div class="col-sm-9">
              <textarea name="alamat" rows="3" class="form-control">{$pasien.alamat}</textarea>
            </div>
          </div>
          <div class="{if: $admin_mode == 'simple'}hidden{/if}">
            <div class="form-group">
              <label for="propinsi" class="col-sm-3 control-label">Propinsi</label>
              <div class="col-sm-4">
                <select name="kd_prop" id="kd_prop" class="form-control" onchange="_updateNmPropFromSelect(); _cascadePropChange()">
                  <option value=""{if: $pasien.kd_prop == ''} selected{/if}>-- Pilih Propinsi --</option>
                  {loop: $propinsi}
                  <option value="{$value.kd_prop}" {if: $pasien.kd_prop == $value.kd_prop}selected{/if}>{$value.nm_prop}</option>
                  {/loop}
                </select>
                <input type="hidden" name="nm_prop" id="nm_prop" class="form-control" value="{$pasien.propinsi.nm_prop}" />
              </div>
              <label for="kota" class="col-sm-1 control-label">Kota</label>
              <div class="col-sm-4">
                <select name="kd_kab" id="kd_kab" class="form-control" onchange="_updateNmKabFromSelect(); _cascadeKabChange()">
                  <option value=""{if: $pasien.kd_kab == ''} selected{/if}>{if: empty($pasien.kd_prop)}-- Pilih Propinsi lebih dulu --{else}-- Pilih Kabupaten/Kota --{/if}</option>
                  {loop: $kabupaten}
                  <option value="{$value.kd_kab}" {if: $pasien.kd_kab == $value.kd_kab}selected{/if}>{$value.nm_kab}</option>
                  {/loop}
                </select>
                <input type="hidden" name="nm_kab" id="nm_kab" class="form-control" value="{$pasien.kabupaten.nm_kab}" />
              </div>
            </div>
            <div class="form-group">
              <label for="kecamatan" class="col-sm-3 control-label">Kecamatan</label>
              <div class="col-sm-4">
                <select name="kd_kec" id="kd_kec" class="form-control" onchange="_updateNmKecFromSelect(); _cascadeKecChange()">
                  <option value=""{if: $pasien.kd_kec == ''} selected{/if}>{if: empty($pasien.kd_kab)}-- Pilih Kabupaten lebih dulu --{else}-- Pilih Kecamatan --{/if}</option>
                  {loop: $kecamatan}
                  <option value="{$value.kd_kec}" {if: $pasien.kd_kec == $value.kd_kec}selected{/if}>{$value.nm_kec}</option>
                  {/loop}
                </select>
                <input type="hidden" name="nm_kec" id="nm_kec" class="form-control" value="{$pasien.kecamatan.nm_kec}" />
              </div>
              <label for="desa" class="col-sm-1 control-label">Desa</label>
              <div class="col-sm-4">
                <select name="kd_kel" id="kd_kel" class="form-control" onchange="_updateNmKelFromSelect()">
                  <option value=""{if: $pasien.kd_kel == ''} selected{/if}>{if: empty($pasien.kd_kec)}-- Pilih Kecamatan lebih dulu --{else}-- Pilih Desa/Kelurahan --{/if}</option>
                  {loop: $kelurahan}
                  <option value="{$value.kd_kel}" {if: $pasien.kd_kel == $value.kd_kel}selected{/if}>{$value.nm_kel}</option>
                  {/loop}
                </select>
                <input type="hidden" name="nm_kel" id="nm_kel" class="form-control" value="{$pasien.kelurahan.nm_kel}" />
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="telepon" class="col-sm-3 control-label">Telepon</label>
            <div class="col-sm-4">
              <input type="text" name="no_tlp" class="form-control noTelepon" value="{$pasien.no_tlp}">
            </div>
            <label for="email" class="col-sm-1 control-label">Email</label>
            <div class="col-sm-4">
              <input type="text" id="email" name="email" class="form-control" value="{$pasien.email}">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  {if: $mlite_crud_permissions.can_create == 'true' || $mlite_crud_permissions.can_update == 'true'}
  <div class="col-md-12 m-b-xl">
    <div class="text-center">
      <button type="button" name="button" class="btn btn-success" id="simpan"><i class="fa fa-save"></i><span class="hidden-xs"> Simpan</span></button>
      <button type="button" name="button" class="btn btn-info hidden" id="kartu" data-no_rkm_medis="{$pasien.no_rkm_medis}"><i class="fa fa-address-book-o"></i><span class="hidden-xs"> Kartu</span></button>
      <a href="{$urlUploadPhoto}" name="button" class="btn btn-warning hidden" id="foto"><i class="fa fa-camera"></i><span class="hidden-xs"> Foto</span></a>
      <button type="button" name="button" class="btn btn-primary hidden" id="kirimwa" data-toggle="modal" data-target="#waModal" data-no_tlp={$pasien.no_tlp}><i class="fa fa-whatsapp"></i><span class="hidden-xs"> Kirim WA</span></button>
      {if: $mlite_crud_permissions.can_delete == 'true'}
      <button type="button" name="button" class="btn btn-danger hidden" id="hapus"><i class="fa fa-trash"></i><span class="hidden-xs"> Hapus</span></button>
      {/if}
      <button type="button" name="button" class="btn btn-primary" id="batal"><i class="fa fa-close"></i><span class="hidden-xs"> Batal</span></button>
    </div>
  </div>
  {/if}
</div>

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
          <button type="button" class="close"><a href="{?=url([ADMIN,'pasien','manage'])?}">Close <span aria-hidden="true">&times;</span></a></button>
      </div>

      <div class="modal-body">
        <center>
          <div id="camera"></div><br>
          <input type="button" class="btn btn-info" value="Ambil Foto" data-dismiss="modal">

        </center>
      </div>
    </div>
  </div>
</div>

        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>

  $('#form select').selectator();
</script>
<script type="text/javascript">
   $(function () {
       $('.tgl_lahir').datetimepicker({
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
       $('.tgl_daftar').datetimepicker({
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
   });
</script>
<script>
  var _urlListWilayah = {
    kabupaten: "{?=url([ADMIN, 'pasien', 'wilayah?show=listkabupaten'])?}",
    kecamatan: "{?=url([ADMIN, 'pasien', 'wilayah?show=listkecamatan'])?}",
    kelurahan: "{?=url([ADMIN, 'pasien', 'wilayah?show=listkelurahan'])?}"
  };
  var _isEditMode = {if: !empty($pasien.no_rkm_medis)}true{else}false{/if};
  var _placeholderWilayah = {
    '#kd_prop': '-- Pilih Propinsi --',
    '#kd_kab': '-- Pilih Kabupaten/Kota --',
    '#kd_kec': '-- Pilih Kecamatan --',
    '#kd_kel': '-- Pilih Desa/Kelurahan --'
  };

  function _extractNmFromSelect(selectId) {
    var $opt = $(selectId + ' option:selected');
    if (!$opt.length) return '';
    var selText = $opt.text();
    if (selText.indexOf('--') === 0) return '';
    return selText.trim();
  }
  function _updateNmPropFromSelect() { $('#nm_prop').val(_extractNmFromSelect('#kd_prop')); }
  function _updateNmKabFromSelect()  { $('#nm_kab').val(_extractNmFromSelect('#kd_kab')); }
  function _updateNmKecFromSelect()  { $('#nm_kec').val(_extractNmFromSelect('#kd_kec')); }
  function _updateNmKelFromSelect()  { $('#nm_kel').val(_extractNmFromSelect('#kd_kel')); }

  function _refillSelectOptions(selectId, jsonList, selectedValue, customPlaceholder) {
    var $sel = $(selectId);
    if ($sel.data('selectator')) { try { $sel.selectator('destroy'); } catch(_err) {} }
    $sel.empty();
    var ph = (typeof customPlaceholder === 'string' && customPlaceholder.length) ? customPlaceholder : (_placeholderWilayah[selectId] || '-- Pilih --');
    $sel.append($('<option></option>').val('').text(ph));
    if (jsonList && jsonList.length) {
      var hasSelected = false;
      for (var i = 0; i < jsonList.length; i++) {
        var it = jsonList[i];
        if (!it.kd || it.kd == '1' && !it.nm) continue;
        var opt = $('<option></option>').val(it.kd).text(it.nm);
        if (selectedValue !== undefined && String(it.kd) === String(selectedValue)) {
          opt.prop('selected', true);
          hasSelected = true;
        }
        $sel.append(opt);
      }
      if (!hasSelected && !selectedValue) {
        $sel.children().first().prop('selected', true);
      }
    }
    $sel.selectator();
  }

  function _cascadePropChange() {
    var kd = $('#kd_prop').val();
    if (!kd) {
      _refillSelectOptions('#kd_kab', [], undefined, '-- Pilih Propinsi lebih dulu --');
      _refillSelectOptions('#kd_kec', [], undefined, '-- Pilih Kabupaten lebih dulu --');
      _refillSelectOptions('#kd_kel', [], undefined, '-- Pilih Kecamatan lebih dulu --');
      _updateNmKabFromSelect();
      _updateNmKecFromSelect();
      _updateNmKelFromSelect();
      return;
    }
    $.ajax({
      url: _urlListWilayah.kabupaten,
      method: 'GET',
      dataType: 'json',
      data: { kd_prop: kd },
      success: function(list) {
        _refillSelectOptions('#kd_kab', list, undefined, '-- Pilih Kabupaten/Kota --');
        _updateNmKabFromSelect();
        var kdKab = $('#kd_kab').val();
        if (kdKab) {
          _cascadeKabChange();
        } else {
          _refillSelectOptions('#kd_kec', [], undefined, '-- Pilih Kabupaten lebih dulu --');
          _refillSelectOptions('#kd_kel', [], undefined, '-- Pilih Kecamatan lebih dulu --');
          _updateNmKecFromSelect();
          _updateNmKelFromSelect();
        }
      },
      error: function() {
        _refillSelectOptions('#kd_kab', [], undefined, '-- Gagal memuat data --');
      }
    });
  }

  function _cascadeKabChange() {
    var kd = $('#kd_kab').val();
    if (!kd) {
      _refillSelectOptions('#kd_kec', [], undefined, '-- Pilih Kabupaten lebih dulu --');
      _refillSelectOptions('#kd_kel', [], undefined, '-- Pilih Kecamatan lebih dulu --');
      _updateNmKecFromSelect();
      _updateNmKelFromSelect();
      return;
    }
    $.ajax({
      url: _urlListWilayah.kecamatan,
      method: 'GET',
      dataType: 'json',
      data: { kd_kab: kd },
      success: function(list) {
        _refillSelectOptions('#kd_kec', list, undefined, '-- Pilih Kecamatan --');
        _updateNmKecFromSelect();
        var kdKec = $('#kd_kec').val();
        if (kdKec) {
          _cascadeKecChange();
        } else {
          _refillSelectOptions('#kd_kel', [], undefined, '-- Pilih Kecamatan lebih dulu --');
          _updateNmKelFromSelect();
        }
      },
      error: function() {
        _refillSelectOptions('#kd_kec', [], undefined, '-- Gagal memuat data --');
      }
    });
  }

  function _cascadeKecChange() {
    var kd = $('#kd_kec').val();
    if (!kd) {
      _refillSelectOptions('#kd_kel', [], undefined, '-- Pilih Kecamatan lebih dulu --');
      _updateNmKelFromSelect();
      return;
    }
    $.ajax({
      url: _urlListWilayah.kelurahan,
      method: 'GET',
      dataType: 'json',
      data: { kd_kec: kd },
      success: function(list) {
        _refillSelectOptions('#kd_kel', list, undefined, '-- Pilih Desa/Kelurahan --');
        _updateNmKelFromSelect();
      },
      error: function() {
        _refillSelectOptions('#kd_kel', [], undefined, '-- Gagal memuat data --');
      }
    });
  }

  $(function() {
    _updateNmPropFromSelect();
    _updateNmKabFromSelect();
    _updateNmKecFromSelect();
    _updateNmKelFromSelect();
    $('#kd_prop').on('change', function() { _updateNmPropFromSelect(); _cascadePropChange(); });
    $('#kd_kab').on('change',  function() { _updateNmKabFromSelect();  _cascadeKabChange(); });
    $('#kd_kec').on('change',  function() { _updateNmKecFromSelect();  _cascadeKecChange(); });
    $('#kd_kel').on('change',  function() { _updateNmKelFromSelect(); });
    if (_isEditMode) {
      if ($('#kd_prop').val() && !$('#kd_kab').children('option[value!=""]').length) {
        _cascadePropChange();
      } else if ($('#kd_kab').val() && !$('#kd_kec').children('option[value!=""]').length) {
        _cascadeKabChange();
      } else if ($('#kd_kec').val() && !$('#kd_kel').children('option[value!=""]').length) {
        _cascadeKecChange();
      }
    }
  });
 </script>
<script>
  {if: $cek_pcare}
  $("#no_ktp").on('keyup', function (event) {
    var baseURL = mlite.url + '/' + mlite.admin;
    var tgl = $('input:text[name=tgl_daftar]').val();
    var no_ktp = $('input:text[name=no_ktp]').val();
    var url = baseURL + '/pcare/byjeniskartu/nik/' + no_ktp + '/' + tgl + '?t=' + mlite.token;

    if (event.key === 'Enter' || event.keyCode === 13) {

      $.get(url, function(data){
        var data = JSON.parse(data);
        var json_obj = [data];
        if(!json_obj[0]) {
          alert('Koneksi ke server BPJS terputus. Silahkan ulangi lagi!');
        } else if(json_obj[0].metaData.code == 200) {
          $('.nama').val(data.response.nama);
          $('.noKartu').val(data.response.noKartu);
          $('.sex').val(data.response.sex);
          $('.tgl_lahir').val(moment(data.response.tglLahir).format('YYYY-MM-DD'));
          $('.noTelepon').val(data.response.noHP);
          if(data.response.kdProviderPst.kdProvider !== '{$usernamePcare}' || data.response.kdProviderPst.kdProviderGigi !== '{$usernamePcare}'){
            alert('Pasien tidak terdaftar sebagai peserta.');
          }
        } else {
          alert(json_obj[0].metaData.message);
        }
      });
    }
  });
  {else}
  $("#no_ktp").on('keyup', function (event) {
    var baseURL = mlite.url + '/' + mlite.admin;
    var tgl = $('input:text[name=tgl_daftar]').val();
    var no_ktp = $('input:text[name=no_ktp]').val();
    var url = baseURL + '/vclaim/bynik/' + no_ktp + '/' + tgl + '?t=' + mlite.token;

    if (event.key === 'Enter' || event.keyCode === 13) {

      $.get(url, function(data){
        var data = JSON.parse(data);
        var json_obj = [data];
        if(!json_obj[0]) {
          alert('Koneksi ke server BPJS terputus. Silahkan ulangi lagi!');
        } else if(json_obj[0].metaData.code == 200) {

<script>
  //triggered when modal is about to be shown
  $('#waModal').on('show.bs.modal', function(e) {
      var no_tlp = $(e.relatedTarget).data('no_tlp');
      $(e.currentTarget).find('input[name="number"]').val(no_tlp);
      _resetWaUi();
  });

  function _resetWaUi() {
    var $btnKirim = $('#waBtnKirim');
    var $btnBatal = $('#waBtnBatal');
    var $alert = $('#waStatusAlert');
    $btnKirim.prop('disabled', false);
    $btnBatal.prop('disabled', false);
    $('#number, #message').prop('disabled', false);
    $btnKirim.find('.wa-btn-label').text(' Kirim');
    $btnKirim.find('.wa-btn-spinner').addClass('hidden');
    $alert.removeClass('alert-success alert-danger alert-warning alert-info').addClass('hidden').html('');
  }

  function _setWaLoading(isLoading) {
    var $btnKirim = $('#waBtnKirim');
    var $btnBatal = $('#waBtnBatal');
    if (isLoading) {
      $btnKirim.prop('disabled', true);
      $btnBatal.prop('disabled', true);
      $('#number, #message').prop('disabled', true);
      $btnKirim.find('.wa-btn-label').text(' Mengirim...');
      $btnKirim.find('.wa-btn-spinner').removeClass('hidden');
    } else {
      $btnKirim.prop('disabled', false);
      $btnBatal.prop('disabled', false);
      $('#number, #message').prop('disabled', false);
      $btnKirim.find('.wa-btn-label').text(' Kirim');
      $btnKirim.find('.wa-btn-spinner').addClass('hidden');
    }
  }

  function _showWaStatus(type, html) {
    var $alert = $('#waStatusAlert');
    $alert.removeClass('alert-success alert-danger alert-warning alert-info hidden');
    var iconMap = { success: 'check-circle', danger: 'exclamation-circle', warning: 'exclamation-triangle', info: 'info-circle' };
    var icon = iconMap[type] || 'info-circle';
    var clsMap = { success: 'alert-success', danger: 'alert-danger', warning: 'alert-warning', info: 'alert-info' };
    $alert.addClass(clsMap[type] || 'alert-info');
    $alert.html('<i class="fa fa-' + icon + '"></i> ' + html);
  }

  function _truncateForDebug(str, n) {
    if (!str) return '';
    if (typeof str !== 'string') str = String(str);
    if (str.length <= n) return str;
    return str.substring(0, n) + '...';
  }

  function KirimWA() {
    var number = document.getElementById("number").value.trim();
    var message = document.getElementById("message").value;

    if (!number) {
      _showWaStatus('warning', 'Nomor WhatsApp tujuan harus diisi.');
      return;
    }
    if (!message || message.trim() === '') {
      _showWaStatus('warning', 'Isi pesan tidak boleh kosong.');
      return;
    }

    var baseURL = (typeof mlite !== 'undefined')
      ? (mlite.url + '/' + mlite.admin)
      : '{?=url(ADMIN)?}';
    var kirimUrl = baseURL + '/pasien/kirimwa?t=' + encodeURIComponent((typeof mlite !== 'undefined' && mlite.token) ? mlite.token : '');

    _setWaLoading(true);
    _showWaStatus('info', 'Sedang mengirim pesan, mohon tunggu...');

    var hasResponded = false;

    function _finish(success, msg) {
      if (hasResponded) return;
      hasResponded = true;
      _setWaLoading(false);
      if (success) {
        _showWaStatus('success', msg || 'Pesan berhasil dikirim.');
        setTimeout(function() {
          $('#waModal').modal('hide');
        }, 1500);
      } else {
        _showWaStatus('danger', msg || 'Gagal mengirim pesan. Silakan coba lagi.');
      }
    }

    $.ajax({
      url: kirimUrl,
      method: 'POST',
      dataType: 'text',
      data: {
        number: number,
        message: message
      },
      timeout: 35000
    })
    .done(function(dataRaw, textStatus, jqXHR) {
      var data = (dataRaw == null) ? '' : String(dataRaw);
      if (data.indexOf('504 Gateway Time-out') !== -1) {
        _finish(false, 'Timeout 504. Gateway WA tidak merespons, coba sesaat lagi.');
        return;
      }
      var jsonResponse = null;
      try {
        jsonResponse = $.parseJSON(data);
      } catch (e) {
        var ct = jqXHR.getResponseHeader('Content-Type') || '';
        if (/html/i.test(ct) || /<\s*(html|!doctype|body|head)\b/i.test(data)) {
          _finish(false, 'Sesu permintaan tidak dikenali (respons HTML/redirect). Coba refresh halaman lalu coba lagi. Preview: ' + _truncateForDebug(data.replace(/<[^>]+>/g, ' '), 80));
          return;
        }
        _finish(false, 'Respons server bukan JSON. Preview: ' + _truncateForDebug(data, 120));
        return;
      }
      if (jsonResponse && (jsonResponse.status === true || jsonResponse.status === 'true' || jsonResponse.status === 1 || jsonResponse.status === '1')) {
        _finish(true, jsonResponse.msg || jsonResponse.message || 'Sukses mengirim pesan.');
      } else {
        var err = (jsonResponse && (jsonResponse.msg || jsonResponse.message)) ? (jsonResponse.msg || jsonResponse.message) : 'Pesan gagal dikirim.';
        _finish(false, String(err));
      }
    })
    .fail(function(jqXHR, textStatus, errorThrown) {
      var resp = jqXHR.responseText;
      if (textStatus === 'timeout') {
        _finish(false, 'Timeout. Gateway WA tidak merespons dalam 35 detik.');
        return;
      }
      if (jqXHR.status === 403) {
        _finish(false, 'Akses ditolak (403). Pastikan sesi login aktif dan coba lagi.');
        return;
      }
      if (jqXHR.status === 0) {
        _finish(false, 'Koneksi gagal (0). Periksa jaringan atau sinkronisasi waktu cookie.');
        return;
      }
      var fallback = 'Gagal mengirim. HTTP ' + (jqXHR.status || '?') + ': ' + (errorThrown || textStatus || '');
      if (resp && typeof resp === 'string' && resp !== '') {
        try {
          var j = $.parseJSON(resp);
          if (j && (j.msg || j.message)) {
            _finish(false, j.msg || j.message);
            return;
          }
        } catch (e) {}
        fallback += ' | Preview: ' + _truncateForDebug(resp.replace(/<[^>]+>/g, ' '), 80);
      }
      _finish(false, fallback);
    });
  }
</script>

        if (queryString.length == 0) {

                for (var i = 0; i < params.length; i++) {
                    var key = params[i].split('=')[0];
                    var value = decodeURIComponent(params[i].split('=')[1]);
                    queryString[key] = value;
                }
            }
            var baseURL = mlite.url + '/' + mlite.admin;
        }
        if (queryString["nama"] != null && queryString["no_telp"] != null) {
            $('input:text[name=nm_pasien]').val(queryString["nama"]);
            $('input:text[name=no_tlp]').val(queryString["no_telp"]);
            $('textarea[name=alamat]').val(queryString["alamat"]);
        }
    });
</script>
